<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Pink Classroom Calculator</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pink Calc">
<meta name="theme-color" content="#FCE4EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: wide screens put the LCD and key trail on the left and the keypad on the right.
   Tall or narrow screens (portrait, split view, iPhone) stack them. The keypad is sized to the space it is given. */
:root{
  --bg:#FCE4EE; --ink:#4A1236; --lcd-ink:#2A1020; --rose:#C2185B; --bezel:#E0457F;
  --gold-ink:#8A5A00; --panel:#FFF7FA; --panel-line:#F2B8CD; --muted:#8C3A63;
  --font-body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --font-display:'Fredoka', 'Atkinson Hyperlegible', system-ui, sans-serif;
  color-scheme: light;
  --ar:0.6348; --hk-ar:100/92;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
.app{height:100%;box-sizing:border-box;display:flex;gap:28px;align-items:stretch;
  padding-top:max(22px, env(safe-area-inset-top, 0px));padding-bottom:max(22px, env(safe-area-inset-bottom, 0px));
  padding-left:max(24px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px))}
.side{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:auto}
.top{display:flex;align-items:center;gap:12px;min-height:34px}
.top h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:26px;color:var(--ink);white-space:nowrap}
.modetag{margin-left:auto;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:2px solid var(--panel-line);border-radius:999px;padding:4px 12px;white-space:nowrap}

/* ---------- LCD ---------- */
.lcd{flex:0 0 auto;height:clamp(120px, 34dvh, 290px);box-sizing:border-box;container-type:size;
  background:linear-gradient(180deg,#F7F4F5,#E9E4E7);border:10px solid var(--bezel);border-radius:24px;
  box-shadow:inset 0 4px 10px rgba(0,0,0,.22),0 4px 0 rgba(163,19,79,.35);padding:10px 20px 12px;
  display:flex;flex-direction:column;color:var(--lcd-ink);font-weight:700}
.status{display:flex;align-items:center;gap:4px;height:14px;flex:0 0 auto}
.ico{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;border-radius:3px;background:#111;color:#fff;font-size:8px;font-weight:700;line-height:1}
.fmt-tag{margin-left:auto;font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-between}
.expr{flex:1 1 auto;min-height:0;display:flex;align-items:center;overflow:hidden;font-size:clamp(14px,min(6.4cqw,12.5cqh),42px)}
.res{flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center;overflow:hidden;min-height:1.25em;font-size:clamp(18px,min(8.6cqw,17.5cqh),56px);color:#1E0A16}
.big .expr{font-size:clamp(14px,min(8.4cqw,12.5cqh),58px)}
.big .res{font-size:clamp(18px,min(11.5cqw,17.5cqh),76px)}
.line{flex:0 0 auto;white-space:nowrap;line-height:1.15;padding:.12em .05em}
.op{margin:0 .14em}
.fnm{margin-right:.04em}
.fr{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;margin:0 .1em;text-align:center}
.fr>.fn{border-bottom:.07em solid currentColor;padding:0 .12em .04em}
.fr>.fd{padding:.04em .12em 0}
.mx{display:inline-flex;align-items:center;vertical-align:middle}
.mx>.mw{margin-right:.06em}
.sq{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 .05em}
.rs{width:.5em;flex:0 0 auto;overflow:visible}
.rs path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ra{border-top:.07em solid currentColor;padding:.06em .08em 0 .06em}
.rt{display:inline-flex;align-items:flex-start;vertical-align:middle}
.ri{font-size:.55em;margin-right:-.35em;margin-top:.1em;position:relative;z-index:1}
.pw{display:inline-block;font-size:.6em;vertical-align:.9em}
.ph{display:inline-block;min-width:.55em;height:.78em;border:.06em dashed rgba(42,16,32,.45);border-radius:.08em;vertical-align:middle;box-sizing:border-box;position:relative}
.ph>.cur{position:absolute;left:.04em;top:.02em;height:.66em;margin:0}
.cur{display:inline-block;width:.075em;height:1.05em;background:var(--rose);vertical-align:middle;margin:0 -.0375em;animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.cur{animation:none}}
.errbox{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.35em;font-size:clamp(15px,3.8cqw,24px)}
.errbox b{font-size:1.5em}
.msg{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.35em;font-size:clamp(15px,3.8cqw,24px)}
.msg b{font-size:1.4em}
.msg span{font-weight:400}
.msg .hint{font-size:.8em;color:var(--muted);font-weight:700}
.note{flex:0 0 auto;font-size:clamp(12px,2.6cqw,16px);color:var(--muted);text-align:right}
.rbox{display:inline-block;min-width:1.1em;padding:0 .12em;border-bottom:.06em solid transparent;text-align:center}
.rbox.on{border-bottom-color:var(--rose)}
.qr{font-size:.7em;margin-right:.1em}
.op small{font-size:.55em}
.ico.wide{width:auto;padding:0 3px}

/* ---------- key trail ---------- */
.trail{flex:1 1 auto;min-height:90px;background:var(--panel);border:2px dashed #E994B5;border-radius:22px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.trail-head{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;align-items:center;align-content:flex-start;gap:8px;overflow-y:auto;min-height:0}
.chip{font-size:17px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--panel-line);border-radius:12px;padding:5px 11px;white-space:nowrap}
.chip.shift{background:#FFE08A;border-color:#E9C44F;color:#5C3A00}
.chip.exe{background:var(--rose);border-color:var(--rose);color:#fff}
.arrow{color:#B5658C;font-size:16px}
.trail-empty{font-size:15px;color:var(--muted);font-weight:400}

/* ---------- heart keypad ---------- */
.padwrap{flex:1 1 0;min-width:0;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.pad{flex:0 0 auto;width:min(100cqw, 640px, calc(100cqh * var(--ar)));container-type:inline-size;
  display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:1cqw 1.2cqw;align-content:start}
.kc{display:flex;flex-direction:column;min-width:0}
.sh{height:3.7cqw;font-size:2.86cqw;font-weight:700;line-height:3.7cqw;color:var(--gold-ink);text-align:center;white-space:nowrap}
.shl{display:inline-block;transition:background .15s, box-shadow .15s}
.shg{display:inline-flex;align-items:flex-start;gap:.3cqw;vertical-align:middle;line-height:0}
.shift-on .shl{background:#FFE08A;color:#5C3A00;border-radius:1.84cqw;padding:0 1.43cqw;box-shadow:0 0 1.6cqw .4cqw rgba(255,201,51,.95),0 0 3.7cqw 1cqw rgba(255,179,0,.5)}
.mbx{display:inline-block;width:1.43cqw;height:1.43cqw;border-radius:.4cqw;border:.31cqw solid var(--gold-ink);box-sizing:border-box;background:#fff}
.mstack{display:inline-flex;flex-direction:column;align-items:center;gap:.2cqw}
.mbar{width:1.84cqw;height:.31cqw;background:var(--gold-ink)}
.hk{position:relative;display:block;width:100%;aspect-ratio:var(--hk-ar);max-width:100%;border:0;background:none;padding:0;margin:0 auto;cursor:pointer;
  font-family:var(--font-body);font-weight:700;color:var(--c);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hk>svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 .8cqw 0 rgba(163,19,79,.28));transition:transform .05s}
.hk .hp{fill:var(--fill);stroke:var(--stroke);stroke-width:3;stroke-linejoin:round}
.hk .hl{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round}
.hk .l{position:absolute;left:0;right:0;top:0;bottom:12%;display:flex;align-items:center;justify-content:center;line-height:1;pointer-events:none;transition:transform .05s}
.hk:active>svg,.hk.pressed>svg{transform:translateY(.6cqw);filter:drop-shadow(0 .2cqw 0 rgba(163,19,79,.28))}
.hk:active .l,.hk.pressed .l{transform:translateY(.6cqw)}
.hk:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:30%}
.hk.blank{cursor:default}
.k-SHIFT>svg{transition:filter .15s}
.shift-on .k-SHIFT{--fill:#FFD54A !important;--stroke:#E08A00 !important}
.shift-on .k-SHIFT>svg{filter:drop-shadow(0 0 1.2cqw #FFC933) drop-shadow(0 0 2.4cqw #FFB300)}
.lw{display:inline-flex;align-items:flex-start;gap:.5cqw}
.bxx{display:inline-block;width:3.67cqw;height:3.67cqw;border-radius:.61cqw;background:var(--ink)}
.bxa{display:inline-block;width:3.06cqw;height:3.06cqw;border-radius:.61cqw;background:#fff;border:.41cqw solid var(--ink);box-sizing:border-box}
.bxa.lil{background:#C79BE3}
.gtxt{font-size:1.75cqw;letter-spacing:-.01em;white-space:nowrap}
.fstack{display:inline-flex;flex-direction:column;align-items:center;gap:.61cqw;line-height:0}
.fbar{width:4.9cqw;height:.61cqw;border-radius:.4cqw;background:var(--ink)}
.fmtk{display:inline-flex;flex-direction:column;align-items:center;gap:.4cqw;line-height:1}
.pi{position:absolute;top:-6%;left:50%;transform:translateX(-50%);font-size:3.6cqw;font-weight:700;line-height:1.1;color:var(--gold-ink);pointer-events:none}
[hidden]{display:none !important}

/* ---------- SETTINGS and TOOLS panels ---------- */
.scrim{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(74,18,54,.3);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));box-sizing:border-box}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border:3px solid var(--panel-line);border-radius:28px;box-shadow:0 14px 40px rgba(74,18,54,.28);padding:0 20px 22px;box-sizing:border-box;color:var(--ink)}
.sheet-head{position:sticky;top:0;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--panel);padding:16px 0 10px}
.sheet-head h2{grid-column:2;margin:0;font-family:var(--font-display);font-weight:600;font-size:23px}
.done{grid-column:3;justify-self:end;font:700 17px var(--font-body);color:#fff;background:var(--rose);border:0;border-radius:999px;padding:9px 20px;cursor:pointer}
.sec{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 8px 8px}
.group{background:#fff;border:2px solid var(--panel-line);border-radius:20px;overflow:hidden}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1.5px solid #F7D3E1;font-size:17px;font-weight:700;width:100%;box-sizing:border-box;background:#fff;color:var(--ink);font-family:var(--font-body);text-align:left}
.group>.srow:first-child,.group>.toolrow:first-child{border-top:0}
.srow.stack{flex-direction:column;align-items:stretch;gap:8px}
.srow small{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.mrow{border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.tick{color:var(--rose);font-size:20px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font:700 15px var(--font-body);color:var(--ink);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#FF9EC4;box-shadow:0 2px 0 rgba(163,19,79,.25)}
.tog{flex:0 0 auto;width:54px;height:32px;border-radius:999px;background:#E9C9D6;border:0;position:relative;cursor:pointer;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.tog[aria-checked="true"]{background:var(--rose)}
.tog[aria-checked="true"]::after{left:25px}
.step{display:flex;align-items:center;gap:12px}
.step b{min-width:1.5em;text-align:center;font-size:19px}
.step button{width:38px;height:38px;border-radius:50%;border:2px solid var(--panel-line);background:#fff;font:700 20px var(--font-body);color:var(--ink);cursor:pointer}
.step button:disabled{opacity:.35}
.toolrow{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-top:1.5px solid #F7D3E1;background:#fff;text-align:left;font:700 18px var(--font-body);color:#A3134F;cursor:pointer}
.toolrow small{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.toolrow svg{width:26px;height:26px;flex:0 0 auto}
.toolrow:disabled{opacity:.4;cursor:default}
.reset{display:block;margin:18px auto 0;border:0;background:none;font:700 15px var(--font-body);color:var(--rose);text-decoration:underline;cursor:pointer}
.sheet button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}

/* extra styling */
.chip.tool{background:#E6C9F2;border-color:#B98AD6;color:#4A1236}
.pis{font-style:normal}
.done.light{background:#fff;color:var(--ink);border:2px solid var(--panel-line)}
.viewrow{justify-content:space-between}
.viewrow>span:first-child{flex:1}
.foot{margin:14px 8px 0;font-size:14px;color:var(--muted);font-weight:400;line-height:1.35}

/* The script sets data-layout on the app: "side" (screen left, keys right) or "stacked" (screen above keys),
   and data-compact for small windows, where hearts are a little wider than tall, the screen is shorter,
   the title is hidden and the key trail becomes one line you can scroll sideways. */
.app[data-compact="1"]{--hk-ar:100/80;--ar:0.7102}
.app[data-layout="stacked"]{flex-direction:column;gap:12px}
.app[data-layout="stacked"] .side{flex:0 0 auto;overflow:visible;gap:12px}
.app[data-layout="stacked"] .lcd{height:clamp(130px, 24dvh, 250px)}
.app[data-layout="stacked"].big .lcd{height:clamp(180px, 34dvh, 360px)}
.app[data-layout="stacked"] .trail{flex:0 0 auto;min-height:0;max-height:118px;padding:10px 16px;gap:8px}

.app[data-layout="stacked"][data-compact="1"]{padding-top:max(10px, env(safe-area-inset-top, 0px));padding-bottom:max(10px, env(safe-area-inset-bottom, 0px));gap:8px}
.app[data-layout="stacked"][data-compact="1"] .side{gap:8px}
.app[data-layout="stacked"][data-compact="1"] .top{display:none}
.app[data-layout="stacked"][data-compact="1"] .lcd{height:clamp(128px, 17dvh, 200px);border-width:7px;border-radius:20px;padding:6px 14px 8px}
.app[data-layout="stacked"][data-compact="1"].big .lcd{height:clamp(170px, 26dvh, 280px)}
.app[data-layout="stacked"][data-compact="1"] .trail{max-height:50px;padding:6px 10px;gap:0;border-radius:16px;flex-direction:row;align-items:center}
.app[data-layout="stacked"][data-compact="1"] .trail-head{display:none}
.app[data-layout="stacked"][data-compact="1"] .chips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;align-items:center;width:100%;padding:2px 0;gap:6px}
.app[data-layout="stacked"][data-compact="1"] .chip{flex:0 0 auto;font-size:14px;padding:3px 8px;border-radius:9px}
.app[data-layout="stacked"][data-compact="1"] .arrow,.app[data-layout="stacked"][data-compact="1"] .trail-empty{flex:0 0 auto}
.app[data-layout="stacked"][data-compact="1"] .trail-empty{font-size:13px}
@media (max-height: 560px){ .app[data-layout="stacked"] .trail{display:none} }

.big .lcd{height:clamp(170px, 46dvh, 400px)}
/* wide but short screens: iPhone on its side */
.app[data-layout="side"][data-compact="1"]{padding-top:max(8px, env(safe-area-inset-top, 0px));padding-bottom:max(8px, env(safe-area-inset-bottom, 0px));gap:16px}
.app[data-layout="side"][data-compact="1"] .side{gap:8px}
.app[data-layout="side"][data-compact="1"] .top{min-height:26px}
.app[data-layout="side"][data-compact="1"] .top h1{font-size:20px}
.app[data-layout="side"][data-compact="1"] .top svg{width:24px;height:22px}
.app[data-layout="side"][data-compact="1"] .lcd{border-width:7px;border-radius:20px;padding:6px 14px 8px}
.app[data-layout="side"][data-compact="1"] .trail{padding:8px 12px;gap:6px;border-radius:16px}
.app[data-layout="side"][data-compact="1"] .trail-head{font-size:11px}
.app[data-layout="side"][data-compact="1"] .chip{font-size:14px;padding:3px 8px;border-radius:9px}
@media (max-height: 420px){ .modetag{display:none} }
/* narrow widths */
@media (max-width: 480px){
  .app{padding-left:max(10px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px))}
  .modetag{display:none}
  .sheet{padding:0 14px 18px}
}
</style>
</head>
<body>


<div class="app" id="app">
  <div class="side">
    <header class="top">
      <svg width="32" height="29" viewBox="0 0 100 92" aria-hidden="true"><path d="M50 88 C18 62 4 44 4 28 C4 14 15 4 28 4 C38 4 46 10 50 18 C54 10 62 4 72 4 C85 4 96 14 96 28 C96 44 82 62 50 88 Z" fill="#C2185B"></path></svg>
      <h1>Pink Calculator</h1>
      <span class="modetag" id="modetag">Calculate</span>
    </header>
    <div class="lcd" role="status" aria-live="polite">
      <div class="status">
        <span class="ico" id="angIco" role="img" aria-label="Degrees">D</span>
        <span class="ico" id="shIco" role="img" aria-label="Shift is on" hidden>S</span>
        <span class="ico wide" id="normIco" hidden>FIX</span>
        <span class="fmt-tag" id="fmtTag"></span>
      </div>
      <div class="screen" id="screen"></div>
    </div>
    <section class="trail" id="trailBox" aria-label="Key trail">
      <div class="trail-head">KEY TRAIL: WHAT I PRESSED</div>
      <div class="chips" id="chips"></div>
    </section>
  </div>
  <div class="padwrap"><div class="pad" id="pad" role="group" aria-label="Calculator keys"></div></div>
</div>
<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<script>
/* ==========================================================
   Pink Calculator engine
   - natural display editing (fractions, roots, powers) with a cursor
   - exact answers: fractions, surds and multiples of pi
   - result views: Standard, Decimal, ENG, Sexagesimal (FORMAT and S<>D)
   - settings: input/output, Deg/Rad/Grad, Norm/Fix/Sci, fraction style,
     decimal mark, digit separator
   - tools: Undo, Remainder, Prime factorisation, Simplify, Ratio
   - the key trail is worked out from what is on the screen, so mistakes
     and deleted keys never appear in it
   ========================================================== */
var CalcCore = (function () {
  'use strict';

  function CalcError(type) { this.type = type; }

  /* ---------- expression tree ---------- */
  var SLOTS = { frac: ['num', 'den'], mixed: ['whole', 'num', 'den'], sqrt: ['arg'], root: ['idx', 'arg'], pow: ['exp'], sci: ['exp'] };
  function mkRow(p, f) { var r = []; r.p = p || null; r.f = f || null; return r; }
  function mkNode(t) { var n = { t: t }; SLOTS[t].forEach(function (f) { n[f] = mkRow(n, f); }); return n; }
  function ch(v) { return { t: 'c', v: v }; }
  function isStruct(it) { return !!SLOTS[it.t]; }
  function enterable(it) { return isStruct(it) && !it.fixed; }
  function cloneItem(it) {
    if (!isStruct(it)) return ch(it.v);
    var n = { t: it.t }; if (it.fixed) n.fixed = true;
    SLOTS[it.t].forEach(function (f) { n[f] = cloneRow(it[f], n, f); });
    return n;
  }
  function cloneRow(row, p, f) {
    var r = mkRow(p, f);
    row.forEach(function (it) { var c = cloneItem(it); c.pr = r; r.push(c); });

  var ICONS = {
    undo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6 L4 10.5 L9 15" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"></path><path d="M4.5 10.5 H14 a5.5 5.5 0 0 1 0 11 H11" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round"></path></svg>',
    rem: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="2" style="fill:currentColor"></circle><path d="M4 12 H20" style="stroke:currentColor;stroke-width:2.2;stroke-linecap:round"></path><circle cx="12" cy="18.5" r="2" style="fill:currentColor"></circle></svg>',
    factor: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 L7 21 M17 3 L15 21 M3.5 8.5 H21 M3 15.5 H20.5" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round"></path></svg>',
    simplify: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9 A7.5 7.5 0 0 0 5.5 7.5 M5 15 A7.5 7.5 0 0 0 18.5 16.5" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round"></path><path d="M19.5 4 V9.2 H14.5 M4.5 20 V14.8 H9.5" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"></path></svg>',
    ratio: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 V7 M5 20 H19 L17 9 H7 Z" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"></path><circle cx="12" cy="4" r="1.6" style="fill:currentColor"></circle></svg>'
  };
  function toolRow(name, title, desc, disabled) {
    return '<button type="button" class="toolrow" data-tool="' + name + '"' + (disabled ? ' disabled' : '') + '>' + ICONS[name] + '<span>' + title + '<small>' + desc + '</small></span></button>';
  }
  function toolsHTML(v) {
    var off = v.calcMode === 'mode2';
    return head('TOOLS') +
      '<div class="group">' + toolRow('undo', 'Undo', 'Takes back the last key you pressed', !v.canUndo || off) + '</div>' +
      '<div class="sec">Calculate tools</div><div class="group">' +
      toolRow('rem', 'Remainder ÷R', 'Divides and shows the remainder, for example 13 ÷R 4', off) +
      toolRow('factor', 'Prime Factorisation', 'Writes the answer as a product of prime factors', off) +
      toolRow('simplify', 'Simplify', 'Simplifies a fraction one step at a time', off) +
      toolRow('ratio', 'Ratio', 'Finds the missing number in A : B = C : D', off) +
      '</div>';
  }
  function viewRowHTML(title, desc, view, cur) {
    return '<button type="button" class="toolrow viewrow" data-view="' + view + '"><span>' + title + '<small>' + desc + '</small></span><span class="tick">' + (cur === view ? '✓' : '') + '</span></button>';
  }
  function formatHTML(v) {
    return '<div class="sheet-head"><h2 id="sheetTitle">FORMAT</h2><button type="button" class="done light" data-close="1">Cancel</button></div>' +
      '<div class="sec">Convert displayed result to</div><div class="group">' +
      viewRowHTML('Standard', 'Fraction, √, π form when possible', 'std', v.view) +
      viewRowHTML('Decimal', 'Plain decimal value', 'dec', v.view) +
      viewRowHTML('ENG Notation', 'a × 10ⁿ where n is a multiple of 3', 'eng', v.view) +
      viewRowHTML('Sexagesimal', 'Degree, minute, second', 'sex', v.view) +
      '</div><p class="foot">EXE on the calculation screen reverts to the original result.</p>';
  }
  function showSheet(name) {
    calc.shift = false;
    lastFocus = document.activeElement;
    openSheet = name;
    scrim.hidden = false;
    render();
    var d = sheet.querySelector('.done'); if (d) d.focus();
  }
  function closeSheet() {
    openSheet = null;
    scrim.hidden = true;
    sheet.innerHTML = '';
    render();
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  scrim.addEventListener('click', function (e) {
    if (e.target === scrim) { closeSheet(); return; }
    var b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.dataset.close) { closeSheet(); return; }
    if (b.dataset.set) { calc.set(b.dataset.set, JSON.parse(b.dataset.val)); render(); return; }
    if (b.dataset.toggle) { var k = b.dataset.toggle; calc.set(k, !calc.settings()[k]); render(); return; }
    if (b.dataset.step) { var sk = b.dataset.step; calc.set(sk, calc.settings()[sk] + (+b.dataset.d)); render(); return; }
    if (b.dataset.mode) { calc.setMode(b.dataset.mode); closeSheet(); return; }
    if (b.dataset.reset) { calc.resetSettings(); render(); return; }
    if (b.dataset.tool) { calc.useTool(b.dataset.tool); closeSheet(); return; }
    if (b.dataset.view) { calc.setView(b.dataset.view); closeSheet(); return; }
  });

  function press(key) {
    if (key === 'SETTINGS') { showSheet('settings'); return; }
    if (key === 'TOOLS') { showSheet('tools'); return; }
    if (key === 'FORMAT') {
      if (calc.calcMode === 'calc' && calc.mode === 'edit') { calc.press('EXE'); render(); }
      if (calc.canConvert()) showSheet('format');
      return;
    }
    calc.press(key); render();
  }

  pad.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-key]');
    if (b) press(b.dataset.key);
  });
  // lets the press-down animation show on iPad
  document.addEventListener('touchstart', function () {}, { passive: true });

  /* ---------- keyboard, for a laptop on the board ---------- */
  var KB = {
    Enter: 'EXE', '=': 'EXE', Backspace: 'DEL', Delete: 'DEL', Escape: 'AC',
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    '+': '+', '-': '−', '*': '×', x: '×', '/': '÷', '(': '(', ')': ')', '^': 'pow', '.': '.',
    s: 'sin', c: 'cos', t: 'tan', r: 'sqrt', f: 'frac', a: 'Ans', q: 'sq'
  };
  document.addEventListener('keydown', function (e) {
    if (openSheet) { if (e.key === 'Escape') { e.preventDefault(); closeSheet(); } return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var key = /^[0-9]$/.test(e.key) ? e.key : KB[e.key];
    if (!key) return;
    e.preventDefault();
    var b = pad.querySelector('button[data-key="' + key + '"]');
    if (b) { b.classList.add('pressed'); setTimeout(function () { b.classList.remove('pressed'); }, 140); }
    press(key);
  });

  render();
})();

</script>

</body>
</html>
