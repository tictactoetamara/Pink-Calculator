<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Wiz Calculator</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wiz Calc">
<meta name="theme-color" content="#FCE4EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: wide screens put the LCD and key trail on the left and the keypad on the right.
   Tall or narrow screens (portrait, split view, iPhone) stack them. The keypad is sized to the space it is given. */
:root{
  --bg:#FCE4EE; --ink:#4A1236; --lcd-ink:#2A1020; --rose:#C2185B; --bezel:#E0457F;
  --gold-ink:#7042B0; --ks-f:#9468D2; --ks-s:#6A3FA8; --ks-c:#fff; --sc-f:#EFE3FA; --sc-s:#B98AD6; --sc-c:#5B2F78; --panel:#FFF7FA; --panel-line:#F2B8CD; --muted:#8C3A63;
  --soft:#F7D3E1; --track:#E9C9D6; --deep:#A3134F; --arrow:#C98AAB; --dash:#E994B5; --box:#C79BE3;
  --shadow:rgba(163,19,79,.28); --shadow-strong:rgba(163,19,79,.35);
  --kn-f:#FFD9E8; --kn-s:#F29BBF; --kf-f:#FF9EC4; --kf-s:#EE6FA3; --ko-f:#FF6FA3; --ko-s:#E0457F;
  --ke-f:#C2185B; --ke-s:#8E0F41; --kd-f:#D6336C; --kd-s:#9E1C4A; --ka-f:#A3134F; --ka-s:#6E0C35;
  --kb-f:#FFF0F6; --kb-s:#E994B5;
  --kx-f:#F1E4F8; --kx-s:#CFA9E6; --kx-c:#6A3F86; --kk-f:#E3CCF2; --kk-s:#B98AD6; --kk-c:#5B2F78; --kt-f:#E6C9F2; --kt-s:#B98AD6;
  --font-body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --font-display:'Fredoka', 'Atkinson Hyperlegible', system-ui, sans-serif;
  color-scheme: light;
  --ar:0.581; --hk-ar:100/92; --hk-h:.92;
}
/* The four calculators each have their own colour: pink, lilac, mint and powder blue. The script sets data-mode on the page. */
html[data-mode="gtx"],html[data-mode="gt85"],html[data-mode="m4"]{--gold-ink:#8A5A00; --alp:#D6336C; --ks-f:#FFE08A; --ks-s:#E9C44F; --ks-c:#4A1236; --sc-f:#FFF3C7; --sc-s:#E9C44F; --sc-c:#7A4D00}
html[data-mode="gtx"]{
  --bg:#F1E8FB; --ink:#33174F; --rose:#7B3FB8; --bezel:#A67ADB; --panel:#FAF6FE; --panel-line:#D9C7F0; --muted:#6B3F94;
  --soft:#E8DCF6; --track:#DCCDF0; --deep:#5B2A91; --arrow:#A98ACF; --dash:#B596DC; --box:#F4B6D4;
  --shadow:rgba(91,42,145,.26); --shadow-strong:rgba(91,42,145,.35);
  --kn-f:#EBDDFA; --kn-s:#C9AEEB; --kf-f:#CDA8F0; --kf-s:#B085DD; --ko-f:#B58BE6; --ko-s:#9663D0;
  --ke-f:#7B3FB8; --ke-s:#552A85; --kd-f:#9358CF; --kd-s:#6C3AA3; --ka-f:#6A32A5; --ka-s:#47207A;
  --kb-f:#F8F3FD; --kb-s:#BBA0E0;
  --kx-f:#FFE3EE; --kx-s:#F2A9C8; --kx-c:#A0305F; --kk-f:#FFD0E3; --kk-s:#EC8FB9; --kk-c:#8C2552; --kt-f:#FFCDE0; --kt-s:#EC8FB9}
html[data-mode="gt85"]{
  --bg:#E3F6EC; --ink:#0F3D2E; --rose:#167A50; --bezel:#4DB88A; --panel:#F5FCF8; --panel-line:#A9DDBF; --muted:#2F6B52;
  --soft:#D3EEDF; --track:#C6E5D3; --deep:#0E5638; --arrow:#78B99A; --dash:#7FCBA4; --box:#D5C0F2;
  --shadow:rgba(14,86,56,.24); --shadow-strong:rgba(14,86,56,.33);
  --kn-f:#DDF5E8; --kn-s:#A5DDBE; --kf-f:#A8E6C4; --kf-s:#74CE9C; --ko-f:#7BD6A6; --ko-s:#4DB87F;
  --ke-f:#167A50; --ke-s:#0E5638; --kd-f:#279467; --kd-s:#17704C; --ka-f:#0F5E40; --ka-s:#093F2B;
  --kb-f:#F2FBF6; --kb-s:#8FD1AE;
  --kx-f:#E9DDF8; --kx-s:#BBA0E0; --kx-c:#5B3A8A; --kk-f:#DCCBF3; --kk-s:#A98BD6; --kk-c:#4A2A78; --kt-f:#E2D2F6; --kt-s:#A98BD6}
html[data-mode="m4"]{
  --bg:#E6F1FB; --ink:#0F2F4D; --rose:#1F64B5; --bezel:#5C9BD6; --panel:#F6FAFE; --panel-line:#B3D3F0; --muted:#2F5E8C;
  --soft:#D9E8F7; --track:#C9DDF1; --deep:#124586; --arrow:#7FAAD6; --dash:#8FBBE6; --box:#F8BCD4;
  --shadow:rgba(18,69,134,.24); --shadow-strong:rgba(18,69,134,.33);
  --kn-f:#DDEEFB; --kn-s:#A8CCEC; --kf-f:#34506E; --kf-s:#1E3550; --kf-c:#FFFFFF; --ko-f:#7DB9EE; --ko-s:#4E96D8;
  --ke-f:#1F64B5; --ke-s:#124586; --kd-f:#3578C7; --kd-s:#215A9E; --ka-f:#164C8F; --ka-s:#0C3463;
  --kb-f:#F3F9FE; --kb-s:#9DC4E8;
  --kx-f:#DCE4EC; --kx-s:#A3B2C3; --kx-c:#3E5068; --kk-f:#DCE4EC; --kk-s:#A3B2C3; --kk-c:#3E5068; --kt-f:#D4DDE7; --kt-s:#9BAABB}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
.app{height:100%;box-sizing:border-box;display:flex;gap:28px;align-items:stretch;
  padding-top:max(22px, env(safe-area-inset-top, 0px));padding-bottom:max(22px, env(safe-area-inset-bottom, 0px));
  padding-left:max(24px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px))}
.side{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:auto;container:side / inline-size}
.top{display:flex;align-items:center;gap:12px;min-height:34px}
.top h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:26px;color:var(--ink);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.top svg{flex:0 0 auto}
.modetag{margin-left:auto;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:2px solid var(--panel-line);border-radius:999px;padding:4px 12px;white-space:nowrap}

/* ---------- LCD ---------- */
.lcd{flex:0 0 auto;height:clamp(120px, 34dvh, 290px);box-sizing:border-box;container-type:size;
  background:linear-gradient(180deg,#F7F4F5,#E9E4E7);border:10px solid var(--bezel);border-radius:24px;
  box-shadow:inset 0 4px 10px rgba(0,0,0,.22),0 4px 0 var(--shadow-strong);padding:10px 20px 12px;
  display:flex;flex-direction:column;color:var(--lcd-ink);font-weight:700}
.status{display:flex;align-items:center;gap:4px;height:14px;flex:0 0 auto}
.ico{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;border-radius:3px;background:#111;color:#fff;font-size:8px;font-weight:700;line-height:1}
.fmt-tag{margin-left:auto;font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-between}
.expr{flex:1 1 auto;min-height:0;display:flex;align-items:center;overflow:hidden;font-size:clamp(14px,min(6.4cqw,12.5cqh),42px)}
.res{flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center;overflow:hidden;min-height:1.25em;font-size:clamp(18px,min(8.6cqw,17.5cqh),56px);color:#1E0A16}
.big .expr{font-size:clamp(14px,min(8.4cqw,12.5cqh),58px)}
.big .res{font-size:clamp(18px,min(11.5cqw,17.5cqh),76px)}
.line{flex:0 0 auto;white-space:nowrap;line-height:1.15;padding:.12em .05em}
.op{margin:0 .14em}
.fnm{margin-right:.04em}
.fr{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;margin:0 .1em;text-align:center}
.fr>.fn{border-bottom:.07em solid currentColor;padding:0 .12em .04em}
.fr>.fd{padding:.04em .12em 0}
.mx{display:inline-flex;align-items:center;vertical-align:middle}
.mx>.mw{margin-right:.06em}
.sq{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 .05em}
.rs{width:.5em;flex:0 0 auto;overflow:visible}
.rs path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ra{border-top:.07em solid currentColor;padding:.06em .08em 0 .06em}
.rt{display:inline-flex;align-items:flex-start;vertical-align:middle}
.ri{font-size:.55em;margin-right:-.35em;margin-top:.1em;position:relative;z-index:1}
.pw{display:inline-block;font-size:.6em;vertical-align:.9em}
.ph{display:inline-block;min-width:.55em;height:.78em;border:.06em dashed rgba(42,16,32,.45);border-radius:.08em;vertical-align:middle;box-sizing:border-box;position:relative}
.ph>.cur{position:absolute;left:.04em;top:.02em;height:.66em;margin:0}
.cur{display:inline-block;width:.075em;height:1.05em;background:var(--rose);vertical-align:middle;margin:0 -.0375em;animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flags{display:inline-flex;gap:4px;align-items:center}
.ico.al{background:var(--alp, #C0267A)}
.ico.wide{width:auto;padding:0 4px}
.ico.hy{background:#444}
.expr{cursor:text;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.dt{position:relative}
.dt::after{content:'';position:absolute;left:50%;top:-.02em;width:.11em;height:.11em;border-radius:50%;background:currentColor;transform:translateX(-50%)}
.sc,.tx,.lg{white-space:nowrap}
.sb{font-size:.6em;vertical-align:-.35em;margin:0 .05em}
.cur.ow{width:.55em;height:.12em;margin:0 -.55em 0 0;vertical-align:-.5em;background:var(--rose)}
.offmsg{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(12px,3cqw,18px);color:rgba(0,0,0,.35);font-weight:600}
.app.lcd-off .lcd{background:linear-gradient(180deg,#9C9598,#8A8286)}
.app.lcd-off .lcd .offmsg{color:rgba(255,255,255,.55)}
.chip.alphac{color:var(--alp, #C0267A);border-color:var(--alp, #C0267A)}
.chip .alpl{font-style:italic;font-family:Georgia,serif}
.chip.tapc{padding:4px 8px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:10px;background:transparent;border:0}
.catgrid button{font:inherit;font-weight:700;font-size:17px;min-height:46px;border-radius:12px;border:2px solid var(--panel-line);background:#fff;color:var(--ink);cursor:pointer}
.catgrid button:active{transform:translateY(1px);background:var(--panel)}
@media (prefers-reduced-motion: reduce){.cur{animation:none}}
.errbox{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.35em;font-size:clamp(15px,3.8cqw,24px)}
.errbox b{font-size:1.5em}
.msg{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.35em;font-size:clamp(15px,3.8cqw,24px)}
.msg b{font-size:1.4em}
.msg span{font-weight:400}
.msg .hint{font-size:.8em;color:var(--muted);font-weight:700}
.note{flex:0 0 auto;font-size:clamp(12px,2.6cqw,16px);color:var(--muted);text-align:right}
.rbox{display:inline-block;min-width:1.1em;padding:0 .12em;border-bottom:.06em solid transparent;text-align:center}
.rbox.on{border-bottom-color:var(--rose)}
.qr{font-size:.7em;margin-right:.1em}
.op small{font-size:.55em}
.ico.wide{width:auto;padding:0 3px}

/* ---------- key trail ---------- */
.trail{flex:1 1 auto;min-height:90px;background:var(--panel);border:2px dashed var(--dash);border-radius:22px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.trail-head{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.chips{--cq:3px;display:flex;flex-wrap:wrap;align-items:center;align-content:flex-start;gap:8px 5px;overflow-y:auto;min-height:0;padding:2px}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:.25em;min-height:36px;box-sizing:border-box;font-size:17px;font-weight:700;line-height:1;color:var(--ink);background:#fff;border:2px solid var(--panel-line);border-radius:12px;padding:4px 11px;white-space:nowrap}
.chip .lw{margin-top:-.2em}
.chip.shift{background:var(--ks-f);border-color:var(--ks-s);color:var(--ks-c);font-size:14px}
.chip.shifted{background:var(--sc-f);border-color:var(--sc-s);color:var(--sc-c)}
.chip.exe{background:var(--rose);border-color:var(--rose);color:#fff}
.chip.tools,.chip.tool,.chip.nav{background:var(--kt-f);border-color:var(--kt-s);color:var(--ink)}
.chip.nav{background:var(--kx-f);border-color:var(--kx-s);color:var(--kx-c);padding:4px 9px}
.chip.tools{font-size:14px}
.chip.auto{opacity:.6;border-style:dashed}
.chip.pending{box-shadow:0 0 8px 2px rgba(255,201,51,.9)}
.chip .icon{display:inline-flex;zoom:1.5}
.arrow{flex:0 0 auto;color:var(--arrow);font-size:15px;line-height:1;margin:0 1px}
.trail-empty{font-size:15px;color:var(--muted);font-weight:400}

/* ---------- heart keypad ---------- */
.padwrap{flex:1 1 0;min-width:0;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.pad{--cq:1cqw;flex:0 0 auto;width:min(100cqw, 640px, calc(100cqh * var(--ar)));container-type:inline-size;
  display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:1cqw 1.2cqw;align-content:start}
.kc{display:flex;flex-direction:column;min-width:0}
.sh{height:calc(3.7 * var(--cq));font-size:calc(2.86 * var(--cq));font-weight:700;line-height:calc(3.7 * var(--cq));color:var(--gold-ink);text-align:center;white-space:nowrap}
.shl{display:inline-block;transition:background .15s, box-shadow .15s}
.shg{display:inline-flex;align-items:flex-start;gap:calc(.3 * var(--cq));vertical-align:middle;line-height:0}
.shift-on .shl{background:#FFE08A;color:#5C3A00;border-radius:calc(1.84 * var(--cq));padding:0 calc(1.43 * var(--cq));box-shadow:0 0 calc(1.6 * var(--cq)) calc(.4 * var(--cq)) rgba(255,201,51,.95),0 0 calc(3.7 * var(--cq)) calc(1 * var(--cq)) rgba(255,179,0,.5)}
.mbx{display:inline-block;width:calc(1.43 * var(--cq));height:calc(1.43 * var(--cq));border-radius:calc(.4 * var(--cq));border:calc(.31 * var(--cq)) solid var(--gold-ink);box-sizing:border-box;background:#fff}
.mstack{display:inline-flex;flex-direction:column;align-items:center;gap:calc(.2 * var(--cq))}
.mbar{width:calc(1.84 * var(--cq));height:calc(.31 * var(--cq));background:var(--gold-ink)}
.hk{position:relative;display:block;width:100%;aspect-ratio:var(--hk-ar);max-width:100%;border:0;background:none;padding:0;margin:0 auto;cursor:pointer;
  font-family:var(--font-body);font-weight:700;color:var(--c);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hk>svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 calc(.8 * var(--cq)) 0 var(--shadow));transition:transform .05s}
.hk .hp{fill:var(--fill);stroke:var(--stroke);stroke-width:3;stroke-linejoin:round}
.hk .hl{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round}
.hk .l{position:absolute;left:0;right:0;top:0;bottom:12%;display:flex;align-items:center;justify-content:center;line-height:1;pointer-events:none;transition:transform .05s}
.hk:active>svg,.hk.pressed>svg{transform:translateY(calc(.6 * var(--cq)));filter:drop-shadow(0 calc(.2 * var(--cq)) 0 var(--shadow))}
.hk:active .l,.hk.pressed .l{transform:translateY(calc(.6 * var(--cq)))}
.hk:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:30%}
.hk.blank{cursor:default}
.k-SHIFT>svg{transition:filter .15s}
.shift-on .k-SHIFT{--fill:#FFD54A !important;--stroke:#E08A00 !important;--c:#4A1236 !important}
.shift-on .k-SHIFT>svg{filter:drop-shadow(0 0 calc(1.2 * var(--cq)) #FFC933) drop-shadow(0 0 calc(2.4 * var(--cq)) #FFB300)}
.lw{display:inline-flex;align-items:flex-start;gap:calc(.5 * var(--cq))}
.bxx{display:inline-block;width:calc(3.67 * var(--cq));height:calc(3.67 * var(--cq));border-radius:calc(.61 * var(--cq));background:var(--ink)}
.bxa{display:inline-block;width:calc(3.06 * var(--cq));height:calc(3.06 * var(--cq));border-radius:calc(.61 * var(--cq));background:#fff;border:calc(.41 * var(--cq)) solid var(--ink);box-sizing:border-box}
.bxa.lil{background:var(--box)}
.gtxt{font-size:calc(1.75 * var(--cq));letter-spacing:-.01em;white-space:nowrap}
.fstack{display:inline-flex;flex-direction:column;align-items:center;gap:calc(.61 * var(--cq));line-height:0}
.fbar{width:calc(4.9 * var(--cq));height:calc(.61 * var(--cq));border-radius:calc(.4 * var(--cq));background:var(--ink)}
.fmtk{display:inline-flex;flex-direction:column;align-items:center;gap:calc(.4 * var(--cq));line-height:1}
.pi{position:absolute;top:-6%;left:50%;transform:translateX(-50%);font-size:calc(3.6 * var(--cq));font-weight:700;line-height:1.1;color:var(--gold-ink);pointer-events:none}
[hidden]{display:none !important}

/* ---------- the four calculators: tabs above the screen ---------- */
.tabs{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.tab{--t:#FFB0CF;--tl:#FFE3EE;--tb:#E0457F;--ti:#4A1236;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font:700 14px var(--font-body);line-height:1.1;color:var(--ti);background:var(--tl);border:2px solid var(--t);border-radius:14px;padding:6px 8px;cursor:pointer;white-space:nowrap}
.tab small{font-size:.74em;font-weight:400;opacity:.85}
.tab .short{display:none}
.tab .tn{overflow:hidden;text-overflow:ellipsis;max-width:100%}
@container side (max-width:500px){.tab .full{display:none}.tab .short{display:inline}.tab{font-size:13px;padding:6px 4px}.tab small{display:none}.gearbtn{width:34px;height:34px}}
.tab[data-m="gtx"]{--t:#D3B6F3;--tl:#F4ECFC;--tb:#8B55C9;--ti:#33174F}
.tab[data-m="gt85"]{--t:#A9E6C5;--tl:#E8F8EF;--tb:#3FAE7B;--ti:#0F3D2E}
.tab[data-m="m4"]{--t:#AFD3F4;--tl:#EAF3FC;--tb:#4C8FD1;--ti:#0F2F4D}
.tab[aria-pressed="true"]{background:var(--t);border-color:var(--tb);box-shadow:0 3px 0 var(--tb)}
.tab:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.gearbtn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--panel-line);background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.gearbtn svg{width:22px;height:22px}
.alp{display:inline-block;margin-left:calc(.9 * var(--cq));color:var(--alp,var(--gold-ink));font-weight:700}
.alp.it,.shl.it{font-style:italic}
.alp:first-child{margin-left:0}
.sh .nm{color:var(--ink);font-size:calc(2.3 * var(--cq));letter-spacing:.03em}
.sh .nm.nms{color:var(--gold-ink)}
.shl.badge{background:var(--gold-ink);color:#fff;border-radius:calc(1.2 * var(--cq));padding:0 calc(1.3 * var(--cq));font-size:.86em;letter-spacing:.02em}
.shift-on .shl.badge{color:#5C3A00}
.shl.sm{font-size:.74em}
.sh .shl:empty{display:none}
.shph{display:inline-block;width:calc(4.2 * var(--cq));height:calc(2.8 * var(--cq));border:calc(.35 * var(--cq)) dashed var(--gold-ink);border-radius:calc(.8 * var(--cq));opacity:.8;vertical-align:middle;box-sizing:border-box}
.hk.ph{min-height:calc(15.67 * var(--cq) * var(--hk-h))}

/* ---------- SETTINGS and TOOLS panels ---------- */
.scrim{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(74,18,54,.3);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));box-sizing:border-box}

.done{grid-column:3;justify-self:end;font:700 17px var(--font-body);color:#fff;background:var(--rose);border:0;border-radius:999px;padding:9px 20px;cursor:pointer}
.sec{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 8px 8px}
.group{background:#fff;border:2px solid var(--panel-line);border-radius:20px;overflow:hidden}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1.5px solid var(--soft);font-size:17px;font-weight:700;width:100%;box-sizing:border-box;background:#fff;color:var(--ink);font-family:var(--font-body);text-align:left}
.group>.srow:first-child,.group>.toolrow:first-child{border-top:0}
.srow.stack{flex-direction:column;align-items:stretch;gap:8px}
.srow small{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.mrow{border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.tick{color:var(--rose);font-size:20px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font:700 15px var(--font-body);color:var(--ink);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--kf-f);box-shadow:0 2px 0 var(--shadow)}
.tog{flex:0 0 auto;width:54px;height:32px;border-radius:999px;background:var(--track);border:0;position:relative;cursor:pointer;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}

      viewRowHTML('Standard', 'Fraction, √, π form when possible', 'std', v.view) +
      viewRowHTML('Decimal', 'Plain decimal value', 'dec', v.view) +
      viewRowHTML('ENG Notation', 'a × 10ⁿ where n is a multiple of 3', 'eng', v.view) +
      viewRowHTML('Sexagesimal', 'Degree, minute, second', 'sex', v.view) +
      '</div><p class="foot">EXE on the calculation screen reverts to the original result.</p>';
  }
  function clrHTML() {
    function row(id, title, desc) { return '<button type="button" class="toolrow viewrow" data-clr="' + id + '"><span>' + title + '<small>' + desc + '</small></span></button>'; }
    return '<div class="sheet-head"><h2 id="sheetTitle">CLR</h2><button type="button" class="done light" data-close="1">Cancel</button></div>' +
      '<div class="sec">What do you want to clear?</div><div class="group">' +
      row('setup', 'Setup', 'Puts the settings back how they started') +
      row('mem', 'Memory', 'Empties A to F, X, Y and M, and Ans') +
      row('all', 'All', 'Clears the settings and the memory') +
      '</div>';
  }
  var CAT_ROWS = [
    ['Hyperbolic', [['sinh', 'sinh'], ['cosh', 'cosh'], ['tanh', 'tanh'], ['asinh', 'sinh⁻¹'], ['acosh', 'cosh⁻¹'], ['atanh', 'tanh⁻¹']]],
    ['Number', [['abs', 'Abs'], ['fact', 'x!'], ['nPr', 'nPr'], ['nCr', 'nCr'], ['Rnd', 'Rnd('], ['Ran', 'Ran#'], ['ranint', 'RanInt(']]],
    ['Angle and polar', [['Pol', 'Pol('], ['Rec', 'Rec(']]]
  ];
  function optnHTML() {
    var title = calc.calcMode === 'gtcw' ? 'CATALOG' : 'OPTN';
    return head(title).replace('class="done"', 'class="done light"').replace('>Done<', '>Cancel<') +
      CAT_ROWS.map(function (g) {
        return '<div class="sec">' + g[0] + '</div><div class="group catgrid">' + g[1].map(function (f) {
          return '<button type="button" data-cat="' + f[0] + '">' + f[1] + '</button>';
        }).join('') + '</div>';
      }).join('');
  }
  function showSheet(name) {
    calc.shift = false;
    lastFocus = document.activeElement;
    openSheet = name;
    scrim.hidden = false;
    render();
    var d = sheet.querySelector('.done'); if (d) d.focus();
  }
  function closeSheet() {
    openSheet = null;
    scrim.hidden = true;
    sheet.innerHTML = '';
    render();
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  scrim.addEventListener('click', function (e) {
    if (e.target === scrim) { closeSheet(); return; }
    var b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.dataset.close) { closeSheet(); return; }
    if (b.dataset.set) { calc.set(b.dataset.set, JSON.parse(b.dataset.val)); render(); return; }
    if (b.dataset.toggle) { var k = b.dataset.toggle; calc.set(k, !calc.settings()[k]); render(); return; }
    if (b.dataset.step) { var sk = b.dataset.step; calc.set(sk, calc.settings()[sk] + (+b.dataset.d)); render(); return; }
    if (b.dataset.mode) { applyMode(b.dataset.mode); closeSheet(); return; }
    if (b.dataset.clr) {
      if (b.dataset.clr === 'setup') calc.resetSettings();
      else if (b.dataset.clr === 'mem') calc.clearMemory();
      else calc.resetAll();
      closeSheet(); return;
    }
    if (b.dataset.cat) { closeSheet(); calc.press('cat:' + b.dataset.cat); render(); return; }
    if (b.dataset.reset) { calc.resetSettings(); render(); return; }
    if (b.dataset.tool) { calc.useTool(b.dataset.tool); closeSheet(); return; }
    if (b.dataset.view) { calc.setView(b.dataset.view); closeSheet(); return; }
  });

  function press(key) {
    if (key === 'SETTINGS') { showSheet('settings'); return; }
    if (key === 'TOOLS') { showSheet('tools'); return; }
    if ((key === 'OPTN' && calc.calcMode === 'gtx') || key === 'CATALOG') { showSheet('optn'); return; }
    if (key === 'FORMAT' && calc.shift) { calc.press('FORMAT'); render(); return; }
    if (key === 'FORMAT') {
      if (calc.calcMode !== 'm4' && calc.mode === 'edit') { calc.autoEval(); render(); }
      if (calc.canConvert()) showSheet('format');
      return;
    }
    calc.press(key);
    var rq = calc.takeReq();
    render();
    if (rq === 'settings') showSheet('settings');
    else if (rq === 'clr') showSheet('clr');
  }

  /* ---------- tap the screen to move the cursor ---------- */
  screen.addEventListener('click', function (e) {
    if (openSheet) return;
    var ex = document.getElementById('expr');
    if (!ex || !ex.contains(e.target) && e.target !== ex) { var r0 = ex && ex.getBoundingClientRect(); if (!r0 || e.clientY < r0.top || e.clientY > r0.bottom) return; }
    var best = null, bd = 1e9, ba = 1e9, x = e.clientX, y = e.clientY;
    function consider(el, rid, idx, isItem) {
      var r = el.getBoundingClientRect();
      if (!r.width && !r.height) return;
      var dx = x < r.left ? r.left - x : x > r.right ? x - r.right : 0;
      var dy = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0;
      var d = Math.sqrt(dx * dx + dy * dy * 4), a = r.width * r.height;
      if (d < bd - 0.5 || (Math.abs(d - bd) <= 0.5 && a < ba)) {
        bd = d; ba = a;
        best = { rid: rid, idx: isItem ? idx + (x > (r.left + r.right) / 2 ? 1 : 0) : 0 };
      }
    }
    ex.querySelectorAll('[data-i]').forEach(function (el) { consider(el, +el.dataset.r, +el.dataset.i, true); });
    ex.querySelectorAll('[data-row]').forEach(function (el) {
      if (!el.querySelector('[data-i][data-r="' + el.dataset.row + '"]')) consider(el, +el.dataset.row, 0, false);
    });
    if (!best) return;
    calc.moveTo(best.rid, best.idx);
    render();
  });

  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.settings) { showSheet('settings'); return; }
    if (b.dataset.m) { applyMode(b.dataset.m); render(); }
  });
  pad.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-key]');
    if (b) press(b.dataset.key);
  });
  // lets the press-down animation show on iPad
  document.addEventListener('touchstart', function () {}, { passive: true });

  /* ---------- keyboard, for a laptop on the board ---------- */
  var KB = {
    Enter: 'EXE', '=': 'EXE', Backspace: 'DEL', Delete: 'DEL', Escape: 'AC',
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    '+': '+', '-': '−', '*': '×', x: '×', '/': '÷', '(': '(', ')': ')', '^': 'pow', '.': '.',
    s: 'sin', c: 'cos', t: 'tan', r: 'sqrt', f: 'frac', a: 'Ans', q: 'sq'
  };
  document.addEventListener('keydown', function (e) {
    if (openSheet) { if (e.key === 'Escape') { e.preventDefault(); closeSheet(); } return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var key = /^[0-9]$/.test(e.key) ? e.key : KB[e.key];
    if (!key) return;
    e.preventDefault();
    var b = pad.querySelector('button[data-key="' + key + '"]');
    if (!b) return;
    b.classList.add('pressed'); setTimeout(function () { b.classList.remove('pressed'); }, 140);
    press(key);
  });

  var startMode = 'gtcw';
  try { startMode = localStorage.getItem(MODE_STORE) || 'gtcw'; } catch (e) { startMode = 'gtcw'; }
  applyMode(startMode);
  render();
})();

</script>

<script>
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
</script>
